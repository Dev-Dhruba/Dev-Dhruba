<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="14" viewBox="0 0 1000 14" role="img" aria-label="divider">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#0057ff"/>
      <stop offset="1" stop-color="#bd00ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0;2 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fadeEdges" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="edges"><rect width="1000" height="14" fill="url(#fadeEdges)"/></mask>
    <filter id="glow" x="-5%" y="-200%" width="110%" height="500%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
  </defs>
  <g mask="url(#edges)">
    <rect x="0" y="5" width="1000" height="4" rx="2" fill="url(#flow)" opacity="0.6" filter="url(#glow)"/>
    <rect x="0" y="6" width="1000" height="2" rx="1" fill="url(#flow)"/>
  </g>
</svg>
